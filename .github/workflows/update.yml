name: Update lottery results

on:
  schedule:
    # 17:30 and 20:30 Bangkok time (UTC+7), every day; the script exits quietly when there is no new draw
    - cron: "30 10 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fetch one specific draw date (YYYY-MM-DD, Gregorian). Leave empty to check all days since the last draw."
        required: false
        default: ""
  push:
    paths:
      - "src/**"
      - "scripts/build.py"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new draws
        if: github.event_name != 'push'
        run: python scripts/update_draws.py "${{ github.event.inputs.date }}"

      - name: Build page
        run: python scripts/build.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data index.html; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          latest=$(python -c "import json;print(max(d['date'] for d in json.load(open('data/draws.json'))))")
          git commit -m "Update results to ${latest}"
          git push
